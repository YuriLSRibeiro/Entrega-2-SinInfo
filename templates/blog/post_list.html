{% extends "base.html" %}

{% block title %}Posts — Blog{% endblock %}

{% block content %}
<h2>Posts</h2>

<a href="{% url 'post_create' %}" class="btn-create" style="display:inline-block;padding:8px 20px;border-radius:5px;text-decoration:none;font-weight:bold;margin-bottom:20px;">+ Novo Post</a>

{% for post in posts %}
<div class="post-card">
    <h3><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h3>
    <p class="post-date">Publicado em {{ post.created_at|date:"d/m/Y \à\s H:i" }}</p>
</div>
{% empty %}
<p>Nenhum post publicado ainda.</p>
{% endfor %}
{% endblock %}
