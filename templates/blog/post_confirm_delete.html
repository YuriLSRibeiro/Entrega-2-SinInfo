{% extends "base.html" %}

{% block title %}Excluir Post — Blog{% endblock %}

{% block content %}
<div class="delete-confirm">
    <h2>⚠️ Confirmar Exclusão</h2>
    <p>Tem certeza de que deseja excluir o post <strong>"{{ post.title }}"</strong>?</p>
    <p>Esta ação não pode ser desfeita.</p>

    <form method="post">
        {% csrf_token %}
        <div class="post-actions" style="justify-content:center;">
            <button type="submit" class="btn-delete">🗑️ Confirmar Exclusão</button>
            <a href="{% url 'post_detail' post.pk %}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
