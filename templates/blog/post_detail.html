{% extends "base.html" %}

{% block title %}{{ post.title }} — Blog{% endblock %}

{% block content %}
<h2>{{ post.title }}</h2>
<p class="post-date">Publicado em {{ post.created_at|date:"d/m/Y \à\s H:i" }}</p>

<div class="post-content">
    {{ post.content|safe }}
</div>

<div class="post-actions">
    <a href="{% url 'post_update' post.pk %}" class="btn-edit">✏️ Editar</a>
    <a href="{% url 'post_delete' post.pk %}" class="btn-delete">🗑️ Excluir</a>
    <a href="{% url 'post_list' %}" class="btn-cancel">← Voltar</a>
</div>
{% endblock %}
