{% extends "base.html" %}

{% block title %}Novo Comentário — {{ post.title }}{% endblock %}

{% block content %}
<h2>Comentar na postagem: "{{ post.title }}"</h2>

<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}

    <div class="post-actions">
        <button type="submit" class="btn-create">💬 Publicar Comentário</button>
        <a href="{% url 'post_detail' post.pk %}" class="btn-cancel">Cancelar</a>
    </div>
</form>
{% endblock %}
